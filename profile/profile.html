<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container ">
    <div class="content">
      <form id="profileForm">
        <div class="form-group">
          <label for="name">Имя:</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Введите ваше имя"
          />
        </div>
        <div class="form-group">
          <label for="age">Возраст:</label>
          <input
            type="text"
            id="age"
            name="age"
            placeholder="Введите ваш возраст"
          />
        </div>
        <div class="form-group">
          <label for="city">Город:</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Введите ваш город"
          />
        </div>
        <div class="form-group">
          <label for="hobby">Хобби:</label>
          <input
            type="text"
            id="hobby"
            name="hobby"
            placeholder="Введите ваш хобби"
          />
        </div>
        <button type="button" id="clear">Очистить данные</button>
      </form>
    </div>
    <div style=" height: 70px;" class="content"> 
        <p id="formResult"></p>
    </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
