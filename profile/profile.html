<!doctype html>
<html lang="ru">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="content">
      <form>

        <label for="name">Имя:</label>
        <input
          type="text"
          id="name"
          name="username"
          placeholder="Введите ваше имя"
        />


        <label for="age">Возраст:</label>
        <input
          type="text"
          id="age"
          name="username"
          placeholder="Введите ваш возраст"
        />
        
        <label for="citi">Город:</label>
        <input
          type="text"
          id="citi"
          name="username"
          placeholder="Введите ваш город:"
          />
          
          <label for="hobbi">Xобби:</label>

          type="text"
          id="hobbi"
          name="username"
          placeholder="Введите ваш хобби:"
          />

          <button id="clear">Очистить данные</button>
      </form>
    </div>
  </body>
  <script src="main.js"></script>
